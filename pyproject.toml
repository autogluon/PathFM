[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pathfm"
version = "0.1.0"
description = "Coherent time-series forecasts with pretrained PathFM models."
readme = "README.md"
license = "CC-BY-NC-4.0 AND Apache-2.0 AND MIT"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "src/pathfm/benchmarks/protocols/*-LICENSE",
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.12.1+cu130",
    "chronos-forecasting==2.3.1",
    "transformers==5.13.0",
    "huggingface-hub>=1.0,<2",
    "safetensors>=0.6",
    "numpy==1.26.4",
    "pandas==2.3.3",
    "einops>=0.8",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab>=4,<5",
    "matplotlib>=3.8",
    "ipywidgets>=8,<9",
]
benchmarks = [
    "fev==0.9.0",
    "datasets==4.8.5",
    "gluonts==0.16.3",
    "scipy==1.17.0",
    "pyyaml>=6",
    "tqdm>=4.66",
    "pyarrow>=16",
    "python-dotenv>=1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pathfm = ["benchmarks/protocols/*", "benchmarks/protocols/**/*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
